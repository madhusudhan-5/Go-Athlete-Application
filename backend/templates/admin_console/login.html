{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin Console</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-background min-h-screen flex items-center justify-center">
    <div class="bg-surface rounded-2xl shadow-xl p-10 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-yellow-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <span class="text-3xl">🔐</span>
            </div>
            <h1 class="text-2xl font-bold text-primary">Admin Console</h1>
            <p class="text-gray-500 mt-2">Sign in to manage your platform</p>
        </div>

        {% if error %}
        <div class="mb-6 p-4 bg-red-50 border border-red-200 rounded-xl text-red-600 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'console-login' %}">
            {% csrf_token %}
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">EMAIL</label>
                    <input type="email" name="email" required
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition"
                        placeholder="superadmin@sportsplatform.com"
                        value="{{ email|default:'' }}">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">PASSWORD</label>
                    <input type="password" name="password" required
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition"
                        placeholder="Enter your password">
                </div>
                <button type="submit"
                    class="w-full bg-primary text-white py-3 rounded-xl font-medium hover:bg-opacity-90 transition">
                    Sign In
                </button>
            </div>
        </form>

        <div class="mt-8 pt-6 border-t border-gray-100">
            <p class="text-center text-sm text-gray-500 mb-3">Demo Credentials</p>
            <div class="bg-gray-50 rounded-xl p-4 text-sm">
                <p class="text-gray-600"><strong>Super Admin:</strong> superadmin@sportsplatform.com / SuperAdmin@123</p>
                <p class="text-gray-600 mt-1"><strong>Admin:</strong> admin@sportsplatform.com / Admin@123</p>
            </div>
        </div>
    </div>
</body>
</html>
